<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Tracking - Browser Tester</title>
    <script src="../js/theme.js"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
</head>
<body>
    <nav>
        <a href="../index.html" class="nav-link">Home</a>
        <a href="media.html" class="nav-link">Media</a>
        <a href="forms.html" class="nav-link">Forms</a>
        <a href="security.html" class="nav-link">Security</a>
        <a href="api.html" class="nav-link">APIs</a>
        <a href="data.html" class="nav-link">Data</a>
        <a href="graphics.html" class="nav-link">Graphics</a>
        <a href="performance.html" class="nav-link">Performance</a>
        <a href="accessibility.html" class="nav-link">Accessibility</a>
        <a href="activity.html" class="nav-link" aria-current="page">Activity</a>
        <a href="jwt.html" class="nav-link">JWT</a>
        <button id="themeSwitcher" class="theme-switcher" type="button">Theme: Auto</button>
    </nav>
    <main id="main-content">
        <header class="page-hero">
            <p class="eyebrow">Activity</p>
            <h1>User Activity</h1>
            <p class="lede">Track interaction and browser-event streams in grouped live logs with clearer visual grouping.</p>
        </header>
        <div class="test-container">
            <section class="test-section" id="mouse-activity">
                <h2>Mouse Activity</h2>
                <div id="mouseActivity" class="activity-log" role="log" aria-live="polite" aria-relevant="additions"></div>
            </section>
            <section class="test-section" id="keyboard-activity">
                <h2>Keyboard Activity</h2>
                <div id="keyboardActivity" class="activity-log" role="log" aria-live="polite" aria-relevant="additions"></div>
            </section>
            <section class="test-section" id="browser-events">
                <h2>Browser Events</h2>
                <div id="browserActivity" class="activity-log" role="log" aria-live="polite" aria-relevant="additions"></div>
            </section>
            <section class="test-section" id="page-interactions">
                <h2>Page Interactions</h2>
                <div id="interactionActivity" class="activity-log" role="log" aria-live="polite" aria-relevant="additions"></div>
            </section>
        </div>
    </main>
    <script src="../js/ui.js"></script>
    <script src="../js/activity.js"></script>
</body>
</html>
